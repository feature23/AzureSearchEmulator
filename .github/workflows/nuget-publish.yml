name: NuGet

on:
  push:
    tags: [ 'v*.*.*' ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to request the GitHub OIDC token that NuGet trusted publishing
      # exchanges for a short-lived API key. Scoped to this job only.
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Pack
      run: dotnet pack AzureSearchEmulator.Aspire --configuration Release --output ./artifacts

    # Request the API key immediately before pushing: each OIDC token is
    # single-use and the key it returns expires after one hour.
    - name: Log in to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push
      run: >-
        dotnet nuget push "./artifacts/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --skip-duplicate
